<!DOCTYPE html>
<html>
<head>
<style>
    /* Styles pour mobile */
    @media only screen and (max-width: 600px) {
        .container { width: 100% !important; }
        .button { display: block !important; width: auto !important; }
    }
</style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff;">
    {logos_html}
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table class="container" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                    
                    <tr>
                        <td style="background-color: #2c2c2c; padding: 30px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px;">🍻 Le Dump est là !</h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <h2 style="color: #f1f1f1; margin-top: 0;">Bonjour {name},</h2>
                            <p style="color: #cccccc; font-size: 16px; line-height: 1.6;">Voici le tant attendu <strong>✨ Dump du Bar ✨</strong>.</p>
                            <p style="color: #cccccc; font-size: 16px; line-height: 1.6;"></span></p>
                            
                            <div style="margin: 35px 0;">
                                <a href="{dump_link}" style="background: linear-gradient(90deg, #ff8a00, #e52e71); color: white; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 16px; display: inline-block; box-shadow: 0 4px 10px rgba(229, 46, 113, 0.4);">
                                    Accéder à mon dump 📸
                                </a>
                            </div>

                            <p style="font-size: 12px; color: #777777; margin-top: 30px;">
                                Si le bouton ne fonctionne pas, copiez ce lien :<br>
                                <a href="{dump_link}" style="color: #ff8a00;">{dump_link}</a>
                            </p>
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="background-color: #121212; padding: 20px; text-align: center; color: #555555; font-size: 12px;">
                            <p style="margin: 0;">Cœur sur vous 🫶</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
